services:
  postgres:
    image: docker.1ms.run/pgvector/pgvector:pg14
    container_name: codecodriver-postgres
    environment:
      POSTGRES_DB: codecodriver
      POSTGRES_USER: codecodriver
      POSTGRES_PASSWORD: codecodriver
    ports:
      - "55432:5432"
    volumes:
      - codecodriver_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecodriver -d codecodriver"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: docker.1ms.run/redis:7-alpine
    container_name: codecodriver-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  sandbox-builder:
    image: codecodriver-sandbox:local
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    command: ["true"]
    restart: "no"

  api:
    image: codecodriver-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: codecodriver-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-builder:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://codecodriver:codecodriver@postgres:5432/codecodriver?sslmode=disable
      CODECODRIVER_REDIS_ADDR: redis:6379
      CODECODRIVER_ADDR: :8080
      CODECODRIVER_SKILLS_DIR: /app/skills
      CODECODRIVER_SANDBOX_DRIVER: docker
      CODECODRIVER_SANDBOX_IMAGE: codecodriver-sandbox:local
      CODECODRIVER_SANDBOX_NETWORK: agent_default
      CODECODRIVER_SANDBOX_GOPROXY: https://goproxy.cn,direct
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      CODECODRIVER_EMBEDDING_API_KEY: ${CODECODRIVER_EMBEDDING_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./skills:/app/skills:ro
      - ./demo:/data

volumes:
  codecodriver_postgres_data:
